
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas - Consultorio Terapéutico</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32"/> <!-- Fallback for older browsers -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="/">
    <meta property="og:title" content="Atlas - Consultorio Terapéutico">
    <meta property="og:description" content="A web application for managing appointments, profiles, and interactions within a therapeutic consultancy practice. It caters to patients, therapists, and administrators.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logo de Atlas, Centro de Terapias">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="/">
    <meta name="twitter:title" content="Atlas - Consultorio Terapéutico">
    <meta name="twitter:description" content="A web application for managing appointments, profiles, and interactions within a therapeutic consultancy practice. It caters to patients, therapists, and administrators.">
    <meta name="twitter:image" content="/og-image.png">
    <meta name="twitter:image:alt" content="Logo de Atlas, Centro de Terapias">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#00deb0', // Main teal from SVG (cls-4)
                light: '#a4edd9',   // Light teal from SVG (cls-5)
                dark: '#00b38f',    // Derived darker teal
              },
              secondary: {
                DEFAULT: '#fbbd00', // Gold/yellow from SVG (cls-8)
                light: '#fcc933',   // Derived lighter gold/yellow
                dark: '#e2ac00',    // Derived darker gold/yellow
              },
              'brand-gray': {
                DEFAULT: '#504f4e', // Gray from SVG (cls-1)
              }
            },
            animation: {
              'pulse-logo': 'pulse-logo 3s ease-in-out infinite',
              'brain-flash': 'brain-flash 3.5s ease-in-out infinite', // Updated duration
            },
            keyframes: {
              'pulse-logo': {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.03)' }, 
              },
              'brain-flash': { 
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.5' }, // Updated minimum opacity
              }
            }
          }
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
